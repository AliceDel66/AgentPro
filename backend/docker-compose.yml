services:
  api:
    build:
      context: .
    # 固定镜像名，部署脚本据此打回滚 tag（agentpro-api:rollback）并在健康检查失败时回退。
    image: agentpro-api:current
    env_file:
      - .env
    environment:
      AGENTPRO_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - agentpro_api_logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentpro_redis:/data
    restart: unless-stopped

volumes:
  agentpro_redis:
  agentpro_api_logs:
