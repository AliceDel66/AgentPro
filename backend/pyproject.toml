[project]
name = "agentpro-backend"
version = "0.1.0"
description = "AgentPro Python backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic-settings>=2.12.0",
  "email-validator>=2.3.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "alembic>=1.17.0",
  "asyncmy>=0.2.10",
  "redis>=7.1.0",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "argon2-cffi>=25.1.0",
  "httpx>=0.28.0",
  "langgraph>=1.0.4",
  "langchain-core>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "aiosqlite>=0.21.0",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
